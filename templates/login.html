<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Connexion - PRONOTE</title>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <span class="login-logo-carre">N</span>
            <div>
                <h1>PRONOTE</h1>
                <p>Lycée Noob Note</p>
            </div>
        </div>

        <form method="POST" class="login-form">
            <label>Identifiant</label>
            <input type="text" name="user_id" placeholder="Votre identifiant" required autofocus>
            <label>Mot de passe</label>
            <input type="password" name="mdp" placeholder="Votre mot de passe" required>
            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        {% with m = get_flashed_messages() %}
            {% if m %}
                <p class="login-erreur">{{ m[0] }}</p>
            {% endif %}
        {% endwith %}

        <p class="login-pied">Espace Élèves &amp; Professeurs</p>
    </div>
</body>
</html>
